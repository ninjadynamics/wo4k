name: Build and release WO4K

# Every push and pull request builds and tests. A version tag (v<VERSION>)
# also publishes a GitHub Release, signing the binaries through SignPath only
# when a SIGNPATH_API_TOKEN secret is configured (releases are currently
# unsigned). No PowerShell is used anywhere in the pipeline.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  fuzz:
    name: Fuzz the file parsers (Linux, libFuzzer + ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and fuzz each parser for 60 seconds
        run: sh fuzz/build-libfuzzer.sh 60

  build:
    name: Build, test, sign and package (Windows)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4

      # The runner's preinstalled MSYS2: downloading the installer from
      # GitHub's release downloads failed with HTTP 504 at times.
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          release: false
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-make

      - name: Read the version
        id: version
        run: |
          set /p VERSION=<VERSION
          echo VERSION=%VERSION%>>"%GITHUB_ENV%"
          echo version=%VERSION%>>"%GITHUB_OUTPUT%"
          echo TOOLCHAIN=${{ steps.msys2.outputs.msys2-location }}\mingw64\bin>>"%GITHUB_ENV%"

      - name: Check the tag matches VERSION
        if: github.ref_type == 'tag'
        run: |
          if not "%GITHUB_REF_NAME%"=="v%VERSION%" (
            echo Tag %GITHUB_REF_NAME% does not match VERSION %VERSION%
            exit /b 1
          )

      - name: Fetch pinned dependencies
        run: |
          set PATH=%TOOLCHAIN%;%PATH%
          mingw32-make TOOLCHAIN=%TOOLCHAIN:\=/% deps

      - name: Build
        run: |
          set PATH=%TOOLCHAIN%;%PATH%
          mingw32-make -j4 TOOLCHAIN=%TOOLCHAIN:\=/% all

      # Fails early (before signing) when docs/CHANGELOG.md has no section
      # for this version.
      - name: Extract the release notes
        if: github.ref_type == 'tag'
        run: |
          set PATH=%TOOLCHAIN%;%PATH%
          mingw32-make TOOLCHAIN=%TOOLCHAIN:\=/% release-notes

      - name: Test
        run: |
          set PATH=%TOOLCHAIN%;%PATH%
          mingw32-make TOOLCHAIN=%TOOLCHAIN:\=/% test

      - name: Collect the binaries to sign
        run: |
          set PATH=%TOOLCHAIN%;%PATH%
          mingw32-make TOOLCHAIN=%TOOLCHAIN:\=/% sign-input

      - name: Upload unsigned binaries
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: wo4k-unsigned-${{ env.VERSION }}
          path: build/unsigned/

      # SignPath Foundation: release-signing requires a maintainer to approve
      # each request in SignPath; the job waits for that approval.
      - name: Sign with SignPath
        if: env.SIGNPATH_API_TOKEN != '' && github.ref_type == 'tag'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: wo4k
          signing-policy-slug: release-signing
          artifact-configuration-slug: release
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: build/signed
          parameters: |
            version: ${{ toJSON(env.VERSION) }}

      # The inventory hashes must describe the signed files, so packaging
      # happens after signing.
      - name: Package
        run: |
          set PATH=%TOOLCHAIN%;%PATH%
          if exist build\signed (
            mingw32-make TOOLCHAIN=%TOOLCHAIN:\=/% package SIGNED=build/signed
          ) else (
            mingw32-make TOOLCHAIN=%TOOLCHAIN:\=/% package
          )

      - name: Finish the release notes
        if: github.ref_type == 'tag'
        run: |
          (
            echo.
            echo Windows binaries are built from this tag by GitHub Actions.
            echo.
            echo See [verifying downloads](https://github.com/${{ github.repository }}#verifying-downloads^) to check the ZIP against its checksum.
          ) >> build\release-notes.md
          copy /y build\release-notes.md dist\release-notes.md >nul

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: wo4k-${{ env.VERSION }}
          path: |
            dist/wo4k-*.zip
            dist/wo4k-*.zip.sha256
            dist/release-notes.md

  # Publishing waits for the fuzzers as well as the Windows build and tests.
  publish:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: [fuzz, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wo4k-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/wo4k-$VERSION.zip" \
            "dist/wo4k-$VERSION.zip.sha256" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "WO4K $VERSION" --notes-file dist/release-notes.md --generate-notes --latest
